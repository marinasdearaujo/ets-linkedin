<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jay Johnston · LinkedIn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5F5F2;--card:#FFFFFF;--ink:#191B21;--muted:#6F7480;--line:#E4E4DE;--accent:#2F55D4;--accent-soft:#EAEEFB;--warn:#B86E00;--warn-soft:#FFF4E0;
  --display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111216;--card:#191B21;--ink:#E9EAEE;--muted:#8F94A1;--line:#2A2D34;--accent:#8AA2F5;--accent-soft:#1F2742;--warn:#E3A243;--warn-soft:#2B2416;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:32px 16px 72px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:28px}
h1{font-family:var(--display);font-weight:600;font-size:24px;margin:0}
.sub{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;background:var(--ink);color:var(--card)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:32px;align-items:start}
.list{position:sticky;top:16px;display:grid;gap:2px}
.list a{display:grid;gap:2px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink)}
.list a:hover{background:var(--card)}
.list a.on{background:var(--card);box-shadow:inset 3px 0 0 var(--ink)}
.list .d{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.list .t{font-size:13px;line-height:1.35}
.list .need{font-size:11px;color:var(--warn)}
.paper{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px 48px 44px;min-width:0}
.eyebrow{font-size:12px;color:var(--muted)}
.paper h2{font-family:var(--display);font-size:26px;line-height:1.25;margin:6px 0 30px}
.field{margin-bottom:40px}
.field>.label{margin-bottom:12px}
.hooks{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:680px}
.hook{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.hook .n{width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:12px;font-weight:600;display:grid;place-items:center}
.hook p{margin:0;font-size:15px;line-height:1.6}
.hook.pick{border-color:var(--accent);background:var(--accent-soft)}
.hook.pick .n{background:var(--accent);color:var(--card)}
.pickchip{grid-column:2;justify-self:start;font-size:11px;border:1px solid var(--accent);color:var(--accent);background:var(--card);border-radius:99px;padding:2px 9px}
.li{border:1px solid var(--line);border-radius:12px;max-width:600px;overflow:hidden}
.li-head{display:flex;gap:10px;align-items:center;padding:14px 18px 6px}
.av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:14px;flex:none}
.av.sm{width:32px;height:32px;font-size:11px}
.li-head b{font-size:14px}
.li-text{white-space:pre-wrap;padding:8px 18px 16px;font-size:15px;line-height:1.6}
.photo{display:flex;gap:14px;align-items:center;padding:22px 18px;background:var(--bg);border-top:1px solid var(--line);font-size:13.5px;min-height:120px}
.photo svg{flex:none;width:36px;height:36px;stroke:var(--muted)}
.cm{display:flex;gap:10px;align-items:flex-start;max-width:600px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:14px;word-break:break-word}
.bubble b{display:block;font-size:13px;margin-bottom:2px}
.bubble .none{color:var(--muted)}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
.rail{display:grid;gap:18px;position:sticky;top:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:14px}
.box h3{font-family:var(--display);font-size:15px;margin:0}
.box.needs{border-color:var(--warn);background:var(--warn-soft)}
.box.needs p{margin:0;font-size:14px}
.item{display:grid;gap:3px}
.item p{margin:0;font-size:13.5px}
.pain{font-family:var(--display);font-size:18px!important;line-height:1.3;font-weight:600}
.quote{border-left:3px solid var(--line);padding-left:12px;font-style:italic;margin-top:8px!important}
.docwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.docframe{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100vh - 150px);min-height:560px}
.docframe iframe{width:100%;height:100%;border:0;display:block}
.fallback{font-size:12.5px;color:var(--muted);margin-top:8px}
.fallback a{color:var(--ink)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days a{font-size:12px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--card)}
.days a.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.days a.need{border-color:var(--warn)}
.rail2{display:grid;gap:16px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
@media (max-width:980px){.docwrap{grid-template-columns:minmax(0,1fr)}.rail2{position:static;max-height:none}.docframe{height:75vh}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-14px 0 30px}
.tbtn{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 11px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.tbtn.done{color:#1C8455;border-color:#1C8455}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 300px}.list{grid-column:1/-1;position:static;display:flex;overflow-x:auto;gap:6px}.list a{min-width:160px}}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}.rail{position:static}.paper{padding:28px 20px}}
</style>
</head>

<script>
const D={"week": "2026-11-17", "doc": "https://docs.google.com/document/d/19IgM2tTAaB-TvUMCDx2xzq4w8phH_BpRaXMMg3kxkg4/edit", "process": "https://docs.google.com/document/d/1irokJbDKxJE85JbytAk2OPsB7hUQMwYh8Rk1LDthlfs/edit", "posts": [{"id": "w1123-tue", "day": "Tue", "date": "2026-11-17", "pillar": "Social proof", "title": "The Sydney COO gift", "hooks": "1. (pick) It's 4:45 PM in Austin and 7:15 AM in Sydney. A COO I just met says it's the best call he's ever done and asks for the contract. I have about 3 hours to get a gift to his office before he goes to bed.\n2. A COO in Sydney signs with us on the first call. The first thing he says is \"wow, you're really fast to respond.\" So I spend the next 3 hours getting a gift hand delivered to his office the same day.\n3. I can't call Australia, the shop can't deliver, and I have 1 evening. A COO in Sydney just signed with us on our first call. My sister ends up booking the courier.\n4. The next morning a COO sends me a screenshot of his Slack. \"I literally met with this vendor yesterday, how the heck did this guy get a gift to us already.\" We've had 1 call.\n5. Every recruiter says they're fast. I have 1 evening to show a COO in Sydney. Here's how it goes.", "draft": "It's 4:45 PM in Austin and 7:15 AM in Sydney. A COO I just met says it's the best call he's ever done and asks for the contract. I have about 3 hours to get a gift to his office before he goes to bed.\n\nQuick story.\n\nHe DMs me over Memorial Day weekend and I happen to reply right away (I'm actually not on LinkedIn that much). First thing he says on the call: \"wow, you're really fast to respond.\"\n\nHe's a COO, operations focused, and he values time.\n\nSo for the next 3 hours of my evening, all I think about is how to get something to him the same day.\n\nI can't call internationally. I find a shop in Sydney online and ask for something custom: company name engraved, wrapped, handwritten note, hand delivered. They say they can have it done in an hour.\n\nThen they tell me they can't deliver it.\n\nOf all things, my sister lives in Sydney. She's at a conference all day, so she books a courier to pick it up and get it to their office.\n\nI go to bed. The next morning there's an email from the COO with a screenshot of his Slack:\n\n\"I literally met with this vendor yesterday, how the heck did this guy get a gift to us already.\"\n\nA few weeks later he's in Austin and wants to meet up. First question: how did you do that?", "photo": "you on the phone or at your laptop, office or coffee shop.", "firstComment": "", "why": {"belief": "Every recruiter says they're fast. This shows it instead of saying it.", "hook": "Two time stamps and a 3 hour deadline in the first line.", "pain": "\"The seat sits open while I look.\"", "quote": "Wow, you're really fast to respond.", "reader": "A founder or COO deciding who to trust with a search.", "resource": "None. The story is the pitch; the DMs it brings are the lead.", "source": "Your podcast with Chris, 3:05 to 7:20 (the Sydney COO story), told almost word for word."}, "needs": "OK to tell it without naming the company? Photo of the gift?", "test": {"title": "Story or math", "variable": "Client story (Tue 17) vs math (Mon 23)"}}, {"id": "w1123-wed", "day": "Wed", "date": "2026-11-18", "pillar": "Interview evaluation", "title": "No calendar link", "hooks": "1. (pick) A hiring manager is telling me, \"when you introduce a candidate to us, don't give them a calendar link.\" And I'm like, really? He wants to see how the seller sets the next step with 0 help from me.\n2. Situational interviewing is dead. More of my hiring managers want 0 calendar links in a candidate intro. They want to watch the seller set the next step.\n3. 0 calendar links. That's the new ask I'm getting from hiring managers when I introduce a candidate. They want to see how the seller controls the frame.\n4. I used to coach people a lot on situational questions. Now hiring managers are asking me not to send a calendar link at all. They want data on the actual skill set.\n5. \"Tell me about a time you...\" is losing to 1 simple test. Hiring managers are asking me to leave the calendar link out of candidate intros. Whoever sets the next step is showing the skill.", "draft": "A hiring manager is telling me, \"when you introduce a candidate to us, don't give them a calendar link.\" And I'm like, really? He wants to see how the seller sets the next step with 0 help from me.\n\nI've had multiple hiring managers say this lately.\n\nThey want to see how the seller controls the frame. They want a little ambiguity, so the seller can actually show the skill set they have.\n\nSituational interviewing is dead. We've shifted into a skill based economy, and hiring managers want as much data as possible on the actual skill.\n\nSo they're watching the whole thing like a sales cycle:\n- How the seller sets the first meeting\n- If they show up with research\n- If they set an agenda\n- If they close and set next steps\n\nThere might still be a little \"tell me about a time you did X.\" But the really sharp hiring managers I work with are evaluating signal over noise.\n\nFor anyone hiring a founding AE, our 7 step hiring guide has the rest of how we run round one (no email required). It's in the first comment.", "photo": "you reading your phone, deadpan.", "firstComment": "7 step hiring guide: [link]?utm_source=linkedin&utm_medium=post&utm_campaign=2026-11-18-no-calendar-link", "why": {"belief": "You can hear a closer in the story they tell.", "hook": "A real quote from a hiring manager (guide hook C), with your own \"really?\" reaction.", "pain": "\"Candidates interview well by default.\"", "quote": "When you introduce a candidate to us, don't give them a calendar link.", "reader": "A founder hiring a founding AE who still runs every interview.", "resource": "7-step hiring guide, first comment.", "source": "Your podcast with Chris, 14:30 to 15:45."}, "needs": "", "test": {"title": "Which free resource brings founders", "variable": "Calculator (Mon) vs 7-step guide (Wed) vs book a call (Flex)"}}, {"id": "w1123-thu", "day": "Thu", "date": "2026-11-19", "pillar": "Thursday Throwdown", "title": "Thursday Throwdown", "hooks": "1. (pick) Thursday Throwdown. I'm on day [X] of swimming 1,000 m a day and the pool is [closed / packed] today. [What I'm doing instead.]\n2. Day [X] of 90. 1,000 m in the pool every day, no days off. [One honest line.]\n3. 1,000 m a day for 90 days. Today is day [X]. [What today's swim feels like, in one line.]\n4. Caffeine was my first 90 day experiment. Swimming 1,000 m a day is this one. Today is day [X].\n5. Thursday Throwdown: [X] meters, [X] minutes, 1 guy who's not a swimmer. Day [X] of 90. [How it's going.]", "draft": "Thursday Throwdown. I'm on day [X] of swimming 1,000 m a day and the pool is [closed / packed] today. [What I'm doing instead.]\n\n[1 or 2 lines: how it's going so far.]\n\nToday's workout:\n- [ ]\n- [ ]\n- [ ]\n\nWhat's the one workout you never skip?", "photo": "you at the pool or post-workout. New photo if you have one from this week.", "firstComment": "", "why": {"belief": "Your data: personal experiments bring 10k to 15k impressions and the most comments. They keep reach up for the buyer posts.", "hook": "Thursday Throwdown with the day count (guide hook I, deadpan facts).", "pain": "Personal experiment", "quote": "", "reader": "Everyone. It keeps the account human.", "resource": "None.", "source": "Your guide: swimming 1,000 m a day, caffeine was the first 90 days."}, "needs": "swim day count, today's workout, one honest line.", "test": null}, {"id": "w1123-fri", "day": "Fri", "date": "2026-11-20", "pillar": "Funny", "title": "Early Black Friday recruiter sale", "hooks": "1. (pick) POV: A recruiter is running an early Black Friday sale. 500 SDR resumes for the price of 1. 7 deals listed below.\n2. Black Friday came early: 500 SDR resumes for the price of 1. None of them read the job description. Here's the rest of the sale.\n3. A recruiter is sending founders an early Black Friday deal. 500 resumes, 1 price, 0 follow ups. I'm reading the fine print (7 things below).\n4. POV: Black Friday came early and resume spam is 50% off. 500 SDR resumes, attainment data sold separately. Here are the details.\n5. 500 applicants, maybe 7 worth a first round. A recruiter is putting the other 493 on sale a week before Black Friday. Here's the catalog.", "draft": "POV: A recruiter is running an early Black Friday sale. 500 SDR resumes for the price of 1. 7 deals listed below.\n\nHere are the details:\n- Every resume is a \"top performer\"\n- None of them read the job description\n- Quota attainment sold separately\n- Free shipping on anyone who applied from a job board at 9:30 PM on a Tuesday\n- Buy 1 hire, get 0 follow ups\n- Bonus: the 3 people you already passed on last month\n- All sales final\n\nI'm not saying volume never works, but out of 500 applicants maybe 7 are worth a first round.", "photo": "the look on your face. You holding a phone or laptop, deadpan.", "firstComment": "", "why": {"belief": "More applicants means better odds.", "hook": "POV list, like your fake JD post. The joke lands on recruiters, never on founders.", "pain": "\"Flooded with resumes that didn't read the JD.\"", "quote": "Not on this random job board at 9:30 PM on a Tuesday.", "reader": "A founder buried in SDR applications.", "resource": "None.", "source": "Your podcast with Chris, 22:44 to 23:10 (500 applications, maybe 7 worth a round). Format from your fake JD post."}, "needs": "", "test": null}, {"id": "w1123-sat", "day": "Sat", "date": "2026-11-21", "pillar": "Send it Saturday", "title": "Send it Saturday", "hooks": "1. (pick) Send it Saturday. I'm [doing X] for the first time at [age]. [The number that makes it scary.]\n2. I'm a creature of habit, so every Saturday I try 1 new thing. Today it's [X]. [How it goes, one line.]\n3. [X] minutes into [new thing] and I'm already [the honest or funny fail]. Send it Saturday. [The number.]\n4. I'm [age] and I've never [done X]. Today I'm [doing it] with [who or where]. [The number that makes it a stretch.]\n5. Saturday number [X] of trying something new. Today it's [X]. [The honest result in one line.]", "draft": "Send it Saturday. I'm a creature of habit, so every Saturday I try 1 thing that pushes me out of my comfort zone. Today it's [X].\n\n[What happens, 2 or 3 lines.]\n\n[The honest or funny moment.]\n\n[Would I do it again?]\n\nWhat's something new you're trying this weekend?", "photo": "an old Dell-era photo next to a current one of the team, or you at the office in East Austin.", "firstComment": "", "why": {"belief": "Your weekend lifestyle slot. Your guide also lists job alerts as your best format (22k to 27k impressions): if you have a live role, it can take this slot.", "hook": "Age + confession (guide hook A). Brackets until you tell us what you're trying.", "pain": "Send it Saturday", "quote": "I'm such a creature of habit.", "reader": "Everyone. It keeps the account human.", "resource": "None.", "source": "Your JD: \"Every Saturday I try to do a thing that pushes me out of my comfort zone.\""}, "needs": "what he's trying this Saturday.", "test": null}, {"id": "w1123-mon", "day": "Mon", "date": "2026-11-23", "pillar": "Hiring manager pain", "title": "A podcast host on $500K of profit", "hooks": "1. (pick) I'm on a podcast and I flip one question back on the host. What would he pay for $500,000 of profit? He says \"a healthy six figures\" and then \"now I'd negotiate.\"\n2. If every seller I hire brings in $500,000 of profit, the fee isn't the question. The question is what I'm willing to pay for that $500,000. A podcast host tells me nobody's asked him that before.\n3. $400,000 to make $500,000. Worst case, I'm taking that deal. So why does a recruiting fee that's a fraction of it feel expensive?\n4. Some of the companies we work with call a new seller \"validated\" at 3x their base in new revenue in 6 months. On a $120K base, that's $360,000. It's the math I do when a founder tells me recruiting is too expensive.\n5. Worst case, I'd pay $400,000 to make $500,000 of profit. That's the math on every good sales hire. A recruiting fee is a fraction of it.", "draft": "I'm on a podcast and I flip one question back on the host. What would he pay for $500,000 of profit? He says \"a healthy six figures\" and then \"now I'd negotiate.\"\n\nFair. I'd negotiate too.\n\nIt's the question I want every leader building a sales team to answer. If I know every seller I hire brings in $500,000 of profit, what am I willing to pay for that?\n\nWorst case... if I can make $500,000 of profit, wouldn't I pay $400,000 to make it? Probably.\n\nSo if a recruiter costs even a fraction of that, it makes so much financial sense.\n\nSome of the companies we work with put a number on it. If a new seller brings in 3x their base salary in new revenue in the first 6 months, they're validated. With recurring revenue, that turns into a flywheel of money.\n\nTake the emotion out of it. What's the profitability per headcount?\n\nFor anyone hiring, I built an empty seat calculator for the other side of this math (no email required). It's in the first comment.", "photo": "you at a desk or whiteboard, mid-conversation.", "firstComment": "Empty seat calculator: [link]?utm_source=linkedin&utm_medium=post&utm_campaign=2026-11-23-500k-profit", "why": {"belief": "The fee is the cost. It isn't: an empty seat and a wrong hire cost far more.", "hook": "A real quote from a real conversation (guide hook C). The host's answer is the twist.", "pain": "\"Recruiting is too expensive.\"", "quote": "What am I willing to pay for $500,000 of profit?", "reader": "A founder or sales leader at seed to Series A, weighing a recruiter fee against hiring alone.", "resource": "Empty seat calculator, first comment.", "source": "Your podcast with Chris, 26:08 to 27:56. Also 20:50: a seller is validated at 3x base in 6 months."}, "needs": "", "test": {"title": "Which free resource brings founders", "variable": "Calculator (Mon) vs 7-step guide (Wed) vs book a call (Flex)"}}, {"id": "w1123-flex", "day": "Flex", "date": null, "pillar": "Hiring manager pain", "title": "Either pay or you pay", "hooks": "1. (pick) A team wants to underpay its first channel account manager, the person who's supposed to grow the channel across the whole US. I tell them they're going to get someone \"channel curious.\" And that person won't be able to hire the 4 to 5 people under them.\n2. Either pay or you pay. I'm saying it to a client about 1 channel hire. Underpay that seat and the 4 to 5 hires under it slow down too.\n3. 1 underpaid channel account manager. 4 to 5 hires that never happen. That's the math I'm walking a client through.\n4. Slightly above market gets someone who's built a channel before. At market, it gets someone \"channel curious.\" The difference shows up in the 4 to 5 people they're supposed to hire next.\n5. If you're willing to overpay, you get really good talent. One of the companies we work with pays new grads up to $120K base. It looks strange and it works.", "draft": "A team wants to underpay its first channel account manager, the person who's supposed to grow the channel across the whole US. I tell them they're going to get someone \"channel curious.\" And that person won't be able to hire the 4 to 5 people under them.\n\nLook, if you want someone to come in and build the book, you're going to have to pay slightly above market.\n\nIf you don't, you get someone who's more channel curious than channel experienced. They take longer to show what they can do. They don't ramp as quick. And they can't hire the 4 to 5 people under them to build out the motion for you.\n\nWith talent right now, it's either pay or you pay. The A players are pretty happy where they are.\n\nOne of the companies we work with goes the other way. They pay new grads up to $120K base with OTE on top. Very strange... but it works for them and they crush it.\n\nFor anyone hiring the first seller who has to build a team, book a call with us. Link in the first comment.", "photo": "you on a call, or with the team at the office.", "firstComment": "Book a call: [calendar link]?utm_source=linkedin&utm_medium=post&utm_campaign=2026-11-flex-either-pay", "why": {"belief": "Paying at market is enough for a founding seller.", "hook": "A real moment with a client, with the 4 to 5 hires that never happen as the number.", "pain": "\"The offer is too weak to land an A player.\"", "quote": "Either pay or you pay.", "reader": "A founder hiring the first seller who has to build a team under them.", "resource": "Book a call, first comment.", "source": "Your podcast with Chris, 23:16 to 24:23. Also 19:50: a client paying new grads up to $120K base."}, "needs": "", "test": {"title": "Which free resource brings founders", "variable": "Calculator (Mon) vs 7-step guide (Wed) vs book a call (Flex)"}}]};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=d=>{const m=String(d||"").match(/^\d{4}-(\d\d)-(\d\d)$/);return m?MON[+m[1]-1]+" "+(+m[2]):""};
const DAYS={Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Flex:"Flex, any day"};
const br=s=>esc(s).replace(/\[([^\]]*)\]/g,"<mark>[$1]</mark>");
function hooks(s){return String(s||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{let t=l.replace(/^\d+[.)]\s*/,"");const pick=/^\(pick\)\s*/i.test(t);return {pick,t:t.replace(/^\(pick\)\s*/i,"")}})}
const dates=D.posts.map(p=>p.date).filter(Boolean).sort();
document.getElementById("range").textContent=dates.length?fmt(dates[0])+" to "+fmt(dates[dates.length-1]):"";
document.getElementById("docBtn").href=D.doc;document.getElementById("procBtn").href=D.process;
const slug=p=>p.day.toLowerCase();
function render(){
  const id=decodeURIComponent((location.hash||"").slice(1)).toLowerCase();
  const p=D.posts.find(x=>slug(x)===id)||D.posts[0];if(!p)return;
  const w=p.why||{};
  const item=(l,v,c)=>v?`<div class="item"><div class="label">${l}</div><p class="${c||""}">${esc(v)}</p></div>`:"";
  document.title=p.title+" · Jay Johnston · LinkedIn";
  document.getElementById("app").innerHTML=`
  <nav class="list" aria-label="Posts">${D.posts.map(x=>`<a href="#${slug(x)}" class="${x.id===p.id?"on":""}"><span class="d">${esc(x.day)}${x.date?" "+fmt(x.date):""}</span><span class="t">${esc(x.title)}</span>${x.needs?`<span class="need">Needs a line from you</span>`:""}</a>`).join("")}</nav>
  <article class="paper">
    <div class="eyebrow">${esc(DAYS[p.day]||p.day)}${p.date?" · "+fmt(p.date):""}${p.pillar?" · "+esc(p.pillar):""}</div>
    <h2>${esc(p.title)}</h2>
    <div class="tools"><button class="tbtn" data-copy="post">Copy post</button><button class="tbtn" data-copy="link">Copy link to this post</button></div>
    <section class="field"><div class="label">Hook options</div>
      <ol class="hooks">${hooks(p.hooks).map((h,i)=>`<li class="hook ${h.pick?"pick":""}"><span class="n">${i+1}</span><p>${br(h.t)}</p>${h.pick?`<span class="pickchip">Our pick · it opens the post</span>`:""}</li>`).join("")}</ol></section>
    <section class="field"><div class="label">The post, as it shows on LinkedIn</div>
      <div class="li"><div class="li-head"><span class="av">JJ</span><div><b>Jay Johnston</b><div class="sub">Elite Tech Sales · Austin</div></div></div>
        <div class="li-text">${br(p.draft)}</div>
        <div class="photo"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg><div><div class="label">Photo</div><div>${esc(p.photo||"One from your folder.")}</div></div></div></div>
    </section>
    <section class="field" style="margin-bottom:0"><div class="label">First comment</div>
      <div class="cm"><span class="av sm">JJ</span><div class="bubble"><b>Jay Johnston</b>${p.firstComment?br(p.firstComment):`<span class="none">No first comment on this one.</span>`}</div></div>
    </section>
  </article>
  <aside class="rail">
    ${p.needs?`<section class="box needs"><h3>Needs from you</h3><p>${esc(p.needs)}</p></section>`:""}
    <section class="box"><h3>Why this post</h3>
      ${item("The pain",String(w.pain||"").replace(/^"|"$/g,""),"pain")}
      ${item(/^"/.test(String(w.pain||""))?"The belief we break":"Why this slot",w.belief)}
      ${item("Who it's for",w.reader)}
      ${w.source||w.quote?`<div class="item"><div class="label">Built from</div><p>${esc(w.source||"")}</p>${w.quote?`<p class="quote">"${esc(w.quote)}"</p>`:""}</div>`:""}
      ${item("Why this hook",w.hook)}
      ${item("Resource",w.resource)}
      ${p.test?`<div class="item"><div class="label">What we're testing</div><p>${esc(p.test.title)}</p><p class="sub">${esc(p.test.variable||"")}</p></div>`:""}
    </section>
  </aside>`;
  S.cur=p;
}
const S={cur:null};
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(_){return false}}}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-copy]");if(!b||!S.cur)return;
  const t=b.dataset.copy==="link"?location.origin+location.pathname+"#"+slug(S.cur):S.cur.draft;
  if(await copyText(t)){const o=b.textContent;b.textContent="Copied";b.classList.add("done");setTimeout(()=>{b.textContent=o;b.classList.remove("done")},1500)}});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
</script>
</body>
