<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Jay Johnston · LinkedIn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#F5F5F2;--card:#FFFFFF;--ink:#191B21;--muted:#6F7480;--line:#E4E4DE;--accent:#2F55D4;--accent-soft:#EAEEFB;--pass:#1C8455;--fail:#C0412F;--pend:#C2C4CA;--warn:#B86E00;--warn-soft:#FFF4E0;
  --display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#111216;--card:#191B21;--ink:#E9EAEE;--muted:#8F94A1;--line:#2A2D34;--accent:#8AA2F5;--accent-soft:#1F2742;--pass:#4CC28A;--fail:#EE7A68;--pend:#4A4D56;--warn:#E3A243;--warn-soft:#2B2416;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:28px 16px 72px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin:22px 0 28px;overflow-x:auto}
nav.tabs a{color:var(--muted);text-decoration:none;padding:8px 0;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-color:var(--ink)}
.btn{display:inline-block;text-decoration:none;font:inherit;font-size:13px;font-weight:500;padding:7px 13px;border-radius:8px;background:var(--ink);color:var(--card);border:0;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:5px 11px;font-size:12.5px}
.btn.done{color:var(--pass);border-color:var(--pass)}
.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.chip.exp{border-color:var(--accent);color:var(--accent)}
.g{width:9px;height:9px;border-radius:50%;background:var(--pend);display:inline-block;flex:none}
.g.pass{background:var(--pass)} .g.fail{background:var(--fail)}
.needs{font-size:12.5px;color:var(--warn)}
.empty{color:var(--muted);padding:24px 0}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
/* production */
.steps{display:grid;grid-template-columns:repeat(6,minmax(96px,1fr));overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.step{background:none;border:0;border-right:1px solid var(--line);padding:12px 12px 10px;text-align:left;cursor:pointer;color:var(--ink);display:grid;gap:2px;font:inherit}
.step:last-child{border-right:0}
.step b{font-family:var(--mono);font-size:20px;font-weight:500}
.step span{font-size:12px;color:var(--muted);white-space:nowrap}
.step.on{background:var(--accent-soft)} .step.on span{color:var(--accent)} .step.zero b{color:var(--pend)}
.hint{font-size:12px;color:var(--muted);margin:10px 2px 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink);display:grid;gap:10px;align-content:start}
a.card:hover{border-color:var(--muted)}
.card .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.card .title{font-weight:600;font-size:15px}
.card .gates{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.card .preview{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--muted)}
/* copy */
.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:32px;align-items:start}
.list{position:sticky;top:16px;display:grid;gap:2px}
.list a{display:grid;gap:2px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink)}
.list a:hover{background:var(--card)}
.list a.on{background:var(--card);box-shadow:inset 3px 0 0 var(--ink)}
.list .d{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.list .t{font-size:13px;line-height:1.35}
.list .need{font-size:11px;color:var(--warn)}
.paper{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px 48px 44px;min-width:0}
.eyebrow{font-size:12px;color:var(--muted)}
.paper h2{font-family:var(--display);font-size:26px;line-height:1.25;margin:6px 0 16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:30px}
.field{margin-bottom:40px}
.field>.label{margin-bottom:12px}
.hooks{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:640px}
.hook{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.hook .n{width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:11px;font-weight:600;display:grid;place-items:center}
.hook p{margin:0;font-size:13.5px;line-height:1.55}
.hook.pick{border-color:var(--accent);background:var(--accent-soft)}
.hook.pick .n{background:var(--accent);color:var(--card)}
.pickchip{grid-column:2;justify-self:start;font-size:11px;border:1px solid var(--accent);color:var(--accent);background:var(--card);border-radius:99px;padding:2px 9px}
.li{border:1px solid var(--line);border-radius:12px;max-width:600px;overflow:hidden}
.li-head{display:flex;gap:10px;align-items:center;padding:14px 18px 6px}
.av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:14px;flex:none}
.av.sm{width:32px;height:32px;font-size:11px}
.li-head b{font-size:14px}
.li-text{white-space:pre-wrap;padding:8px 18px 16px;font-size:15px;line-height:1.6}
.photo{display:flex;gap:14px;align-items:center;padding:22px 18px;background:var(--bg);border-top:1px solid var(--line);font-size:13.5px;min-height:120px}
.photo svg{flex:none;width:36px;height:36px;stroke:var(--muted)}
.cm{display:flex;gap:10px;align-items:flex-start;max-width:600px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:14px;word-break:break-word}
.bubble b{display:block;font-size:13px;margin-bottom:2px}
.bubble .none{color:var(--muted)}
.rail{display:grid;gap:18px;position:sticky;top:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:14px}
.box h3{font-family:var(--display);font-size:15px;margin:0}
.box.needbox{border-color:var(--warn);background:var(--warn-soft)}
.box.needbox p{margin:0;font-size:14px}
.item{display:grid;gap:3px}
.item p{margin:0;font-size:13.5px}
.pain{font-family:var(--display);font-size:18px!important;line-height:1.3;font-weight:600}
.quote{border-left:3px solid var(--line);padding-left:12px;font-style:italic;margin-top:8px!important}
.status-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.checks{display:grid;gap:6px;font-size:13px}
.checks div{display:flex;gap:8px;align-items:center}
/* doc */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg a{font-size:12.5px;font-weight:500;padding:5px 12px;text-decoration:none;color:var(--ink)}
.seg a.on{background:var(--ink);color:var(--card)}
.postdoc{border:1px solid var(--line);border-radius:12px;overflow:hidden;height:calc(100vh - 230px);min-height:600px}
.layout.editing{grid-template-columns:180px minmax(0,1fr)}
.layout.editing .rail{display:none}
.layout.editing .paper{padding:24px 24px 28px}
.layout.editing .paper h2{font-size:22px}
.postdoc iframe{width:100%;height:100%;border:0;display:block}
.photo-drop{border-top:1px solid var(--line);background:var(--bg);padding:14px 18px;display:grid;gap:10px}
.photo-drop .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.photo-drop iframe{width:100%;height:150px;border:1px dashed var(--line);border-radius:8px;background:var(--card)}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:24px}
.res .box p{margin:0;font-size:13.5px}
.res .wait{font-size:12.5px;color:var(--warn)}
.folder{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.folder iframe{width:100%;height:320px;border:0;display:block}
.docframe{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100vh - 190px);min-height:560px}
.docframe iframe{width:100%;height:100%;border:0;display:block}
.fallback{font-size:12.5px;color:var(--muted);margin-top:8px}
.fallback a{color:var(--ink)}
/* experiments */
.exp-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px;margin-bottom:14px;max-width:820px}
.exp-card h3{font-family:var(--display);font-size:16px;margin:0}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.state{font-size:12px;font-weight:600;color:var(--accent)}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px;max-width:820px}
.score div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.score b{display:block;font-family:var(--mono);font-size:24px;font-weight:500}
.score span{font-size:12px;color:var(--muted)}
@media (max-width:1100px){.layout.editing{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 300px}.list{grid-column:1/-1;position:static;display:flex;overflow-x:auto;gap:6px}.list a{min-width:160px}}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}.rail{position:static}.paper{padding:28px 20px}.docframe{height:75vh}}
@media (max-width:520px){.score{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
const D={"week": "2026-11-17", "stage": 1, "doc": "https://docs.google.com/document/d/19IgM2tTAaB-TvUMCDx2xzq4w8phH_BpRaXMMg3kxkg4/edit", "posts": [{"id": "w1123-tue", "day": "Tue", "date": "2026-11-17", "pillar": "Social proof", "stage": "qa", "title": "The Sydney COO gift", "hooks": "1. (pick) It's 4:45 PM in Austin and 7:15 AM in Sydney. A COO I just met says it's the best call he's ever done and asks for the contract. I have about 3 hours to get a gift to his office before he goes to bed.\n2. A COO in Sydney signs with us on the first call. The first thing he says is \"wow, you're really fast to respond.\" So I spend the next 3 hours getting a gift hand delivered to his office the same day.\n3. I can't call Australia, the shop can't deliver, and I have 1 evening. A COO in Sydney just signed with us on our first call. My sister ends up booking the courier.\n4. The next morning a COO sends me a screenshot of his Slack. \"I literally met with this vendor yesterday, how the heck did this guy get a gift to us already.\" We've had 1 call.\n5. Every recruiter says they're fast. I have 1 evening to show a COO in Sydney. Here's how it goes.", "draft": "It's 4:45 PM in Austin and 7:15 AM in Sydney. A COO I just met says it's the best call he's ever done and asks for the contract. I have about 3 hours to get a gift to his office before he goes to bed.\n\nQuick story.\n\nHe DMs me over Memorial Day weekend and I happen to reply right away (I'm actually not on LinkedIn that much). First thing he says on the call: \"wow, you're really fast to respond.\"\n\nHe's a COO, operations focused, and he values time.\n\nSo for the next 3 hours of my evening, all I think about is how to get something to him the same day.\n\nI can't call internationally. I find a shop in Sydney online and ask for something custom: company name engraved, wrapped, handwritten note, hand delivered. They say they can have it done in an hour.\n\nThen they tell me they can't deliver it.\n\nOf all things, my sister lives in Sydney. She's at a conference all day, so she books a courier to pick it up and get it to their office.\n\nI go to bed. The next morning there's an email from the COO with a screenshot of his Slack:\n\n\"I literally met with this vendor yesterday, how the heck did this guy get a gift to us already.\"\n\nA few weeks later he's in Austin and wants to meet up. First question: how did you do that?", "photo": "you on the phone or at your laptop, office or coffee shop.", "docId": "1g2qguA1C41in9s9aTyRcrLJAu09AHv1HJhxQLmK2Mps", "photoFolder": "1Ug2IwSnBONzu9-a3sxsFsYXw26uIMc_v", "firstComment": "", "why": {"belief": "Every recruiter says they're fast. This shows it instead of saying it.", "hook": "Two time stamps and a 3 hour deadline in the first line.", "pain": "\"The seat sits open while I look.\"", "quote": "Wow, you're really fast to respond.", "reader": "A founder or COO deciding who to trust with a search.", "resource": "None. The story is the pitch; the DMs it brings are the lead.", "source": "Your podcast with Chris, 3:05 to 7:20 (the Sydney COO story), told almost word for word."}, "needs": "OK to tell it without naming the company? Photo of the gift?", "gates": {"ai": "pass", "buyer": "pass", "facts": "pending", "hook": "pass", "voice": "pass"}, "edits": null, "leads": null, "founderComments": null, "test": {"code": "E2", "title": "Story or math", "variable": "Format: client story (Tue 17) vs math (Mon 23)"}}, {"id": "w1123-wed", "day": "Wed", "date": "2026-11-18", "pillar": "Interview evaluation", "stage": "ready", "title": "No calendar link", "hooks": "1. (pick) A hiring manager is telling me, \"when you introduce a candidate to us, don't give them a calendar link.\" And I'm like, really? He wants to see how the seller sets the next step with 0 help from me.\n2. Situational interviewing is dead. More of my hiring managers want 0 calendar links in a candidate intro. They want to watch the seller set the next step.\n3. 0 calendar links. That's the new ask I'm getting from hiring managers when I introduce a candidate. They want to see how the seller controls the frame.\n4. I used to coach people a lot on situational questions. Now hiring managers are asking me not to send a calendar link at all. They want data on the actual skill set.\n5. \"Tell me about a time you...\" is losing to 1 simple test. Hiring managers are asking me to leave the calendar link out of candidate intros. Whoever sets the next step is showing the skill.", "draft": "A hiring manager is telling me, \"when you introduce a candidate to us, don't give them a calendar link.\" And I'm like, really? He wants to see how the seller sets the next step with 0 help from me.\n\nI've had multiple hiring managers say this lately.\n\nThey want to see how the seller controls the frame. They want a little ambiguity, so the seller can actually show the skill set they have.\n\nSituational interviewing is dead. We've shifted into a skill based economy, and hiring managers want as much data as possible on the actual skill.\n\nSo they're watching the whole thing like a sales cycle:\n- How the seller sets the first meeting\n- If they show up with research\n- If they set an agenda\n- If they close and set next steps\n\nThere might still be a little \"tell me about a time you did X.\" But the really sharp hiring managers I work with are evaluating signal over noise.\n\nFor anyone hiring a founding AE, our 7 step hiring guide has the rest of how we run round one (no email required). It's in the first comment.", "photo": "you reading your phone, deadpan.", "docId": "1-zXRqpPtKwOsr-evzyiKNvfj6PZ_pCk8VXL7SmfsYkY", "photoFolder": "1ENWUFrF8W8RP-CxNzptEwaB7-MDJ2sD9", "firstComment": "7 step hiring guide: [link]?utm_source=linkedin&utm_medium=post&utm_campaign=2026-11-18-no-calendar-link", "why": {"belief": "You can hear a closer in the story they tell.", "hook": "A real quote from a hiring manager (guide hook C), with your own \"really?\" reaction.", "pain": "\"Candidates interview well by default.\"", "quote": "When you introduce a candidate to us, don't give them a calendar link.", "reader": "A founder hiring a founding AE who still runs every interview.", "resource": "7-step hiring guide, first comment.", "source": "Your podcast with Chris, 14:30 to 15:45."}, "needs": "", "gates": {"ai": "pass", "buyer": "pass", "facts": "pass", "hook": "pass", "voice": "pass"}, "edits": null, "leads": null, "founderComments": null, "test": {"code": "E1", "title": "Which free resource brings founders", "variable": "CTA type: calculator vs 7-step guide vs book a call"}}, {"id": "w1123-thu", "day": "Thu", "date": "2026-11-19", "pillar": "Thursday Throwdown", "stage": "qa", "title": "Thursday Throwdown", "hooks": "1. (pick) Thursday Throwdown. I'm on day [X] of swimming 1,000 m a day and the pool is [closed / packed] today. [What I'm doing instead.]\n2. Day [X] of 90. 1,000 m in the pool every day, no days off. [One honest line.]\n3. 1,000 m a day for 90 days. Today is day [X]. [What today's swim feels like, in one line.]\n4. Caffeine was my first 90 day experiment. Swimming 1,000 m a day is this one. Today is day [X].\n5. Thursday Throwdown: [X] meters, [X] minutes, 1 guy who's not a swimmer. Day [X] of 90. [How it's going.]", "draft": "Thursday Throwdown. I'm on day [X] of swimming 1,000 m a day and the pool is [closed / packed] today. [What I'm doing instead.]\n\n[1 or 2 lines: how it's going so far.]\n\nToday's workout:\n- [ ]\n- [ ]\n- [ ]\n\nWhat's the one workout you never skip?", "photo": "you at the pool or post-workout. New photo if you have one from this week.", "docId": "1dx4QRX9i9REgEKhD-6VKfcNY5O1IzGgu9AxcNmKER7E", "photoFolder": "1W_FrknpCI8hbnp30KiBcY9TbPbxONTK0", "firstComment": "", "why": {"belief": "Your data: personal experiments bring 10k to 15k impressions and the most comments. They keep reach up for the buyer posts.", "hook": "Thursday Throwdown with the day count (guide hook I, deadpan facts).", "pain": "Personal experiment", "quote": "", "reader": "Everyone. It keeps the account human.", "resource": "None.", "source": "Your guide: swimming 1,000 m a day, caffeine was the first 90 days."}, "needs": "swim day count, today's workout, one honest line.", "gates": {"ai": "pass", "buyer": "pass", "facts": "pending", "hook": "pending", "voice": "pass"}, "edits": null, "leads": null, "founderComments": null, "test": null}, {"id": "w1123-fri", "day": "Fri", "date": "2026-11-20", "pillar": "Funny", "stage": "ready", "title": "Early Black Friday recruiter sale", "hooks": "1. (pick) POV: A recruiter is running an early Black Friday sale. 500 SDR resumes for the price of 1. 7 deals listed below.\n2. Black Friday came early: 500 SDR resumes for the price of 1. None of them read the job description. Here's the rest of the sale.\n3. A recruiter is sending founders an early Black Friday deal. 500 resumes, 1 price, 0 follow ups. I'm reading the fine print (7 things below).\n4. POV: Black Friday came early and resume spam is 50% off. 500 SDR resumes, attainment data sold separately. Here are the details.\n5. 500 applicants, maybe 7 worth a first round. A recruiter is putting the other 493 on sale a week before Black Friday. Here's the catalog.", "draft": "POV: A recruiter is running an early Black Friday sale. 500 SDR resumes for the price of 1. 7 deals listed below.\n\nHere are the details:\n- Every resume is a \"top performer\"\n- None of them read the job description\n- Quota attainment sold separately\n- Free shipping on anyone who applied from a job board at 9:30 PM on a Tuesday\n- Buy 1 hire, get 0 follow ups\n- Bonus: the 3 people you already passed on last month\n- All sales final\n\nI'm not saying volume never works, but out of 500 applicants maybe 7 are worth a first round.", "photo": "the look on your face. You holding a phone or laptop, deadpan.", "docId": "1hnyHGUEdYwwwI5bFm3GSB3jMR0PKlSgQ2shRAFyXWOw", "photoFolder": "1WmapTgYvYu0qgCavpI8jJlxqStM-QoNk", "firstComment": "", "why": {"belief": "More applicants means better odds.", "hook": "POV list, like your fake JD post. The joke lands on recruiters, never on founders.", "pain": "\"Flooded with resumes that didn't read the JD.\"", "quote": "Not on this random job board at 9:30 PM on a Tuesday.", "reader": "A founder buried in SDR applications.", "resource": "None.", "source": "Your podcast with Chris, 22:44 to 23:10 (500 applications, maybe 7 worth a round). Format from your fake JD post."}, "needs": "", "gates": {"ai": "pass", "buyer": "pass", "facts": "pass", "hook": "pass", "voice": "pass"}, "edits": null, "leads": null, "founderComments": null, "test": null}, {"id": "w1123-sat", "day": "Sat", "date": "2026-11-21", "pillar": "Send it Saturday", "stage": "qa", "title": "Send it Saturday", "hooks": "1. (pick) Send it Saturday. I'm [doing X] for the first time at [age]. [The number that makes it scary.]\n2. I'm a creature of habit, so every Saturday I try 1 new thing. Today it's [X]. [How it goes, one line.]\n3. [X] minutes into [new thing] and I'm already [the honest or funny fail]. Send it Saturday. [The number.]\n4. I'm [age] and I've never [done X]. Today I'm [doing it] with [who or where]. [The number that makes it a stretch.]\n5. Saturday number [X] of trying something new. Today it's [X]. [The honest result in one line.]", "draft": "Send it Saturday. I'm a creature of habit, so every Saturday I try 1 thing that pushes me out of my comfort zone. Today it's [X].\n\n[What happens, 2 or 3 lines.]\n\n[The honest or funny moment.]\n\n[Would I do it again?]\n\nWhat's something new you're trying this weekend?", "photo": "an old Dell-era photo next to a current one of the team, or you at the office in East Austin.", "docId": "1DH_mpbMFOo4hWrs4E1AVXMKw7uGW43_uI1Jl0AAlVl0", "photoFolder": "1QV0rxki2jneriSFdVgsG8bUaipG93Dht", "firstComment": "", "why": {"belief": "Your weekend lifestyle slot. Your guide also lists job alerts as your best format (22k to 27k impressions): if you have a live role, it can take e US. I tell them they're going to get someone \"channel curious.\" And that person won't be able to hire the 4 to 5 people under them.\n2. Either pay or you pay. I'm saying it to a client about 1 channel hire. Underpay that seat and the 4 to 5 hires under it slow down too.\n3. 1 underpaid channel account manager. 4 to 5 hires that never happen. That's the math I'm walking a client through.\n4. Slightly above market gets someone who's built a channel before. At market, it gets someone \"channel curious.\" The difference shows up in the 4 to 5 people they're supposed to hire next.\n5. If you're willing to overpay, you get really good talent. One of the companies we work with pays new grads up to $120K base. It looks strange and it works.", "draft": "A team wants to underpay its first channel account manager, the person who's supposed to grow the channel across the whole US. I tell them they're going to get someone \"channel curious.\" And that person won't be able to hire the 4 to 5 people under them.\n\nLook, if you want someone to come in and build the book, you're going to have to pay slightly above market.\n\nIf you don't, you get someone who's more channel curious than channel experienced. They take longer to show what they can do. They don't ramp as quick. And they can't hire the 4 to 5 people under them to build out the motion for you.\n\nWith talent right now, it's either pay or you pay. The A players are pretty happy where they are.\n\nOne of the companies we work with goes the other way. They pay new grads up to $120K base with OTE on top. Very strange... but it works for them and they crush it.\n\nFor anyone hiring the first seller who has to build a team, book a call with us. Link in the first comment.", "photo": "you on a call, or with the team at the office.", "docId": "15ruK1ey9KtrAi9VUoJ5WbD2aourXjqL1iq8qFlDBYG8", "photoFolder": "1wIvzW8EXWmy2DmkrbyziyyDqOu2eMe_K", "firstComment": "Book a call: [calendar link]?utm_source=linkedin&utm_medium=post&utm_c const STEPS=[
  {k:"idea",t:"Idea",h:"Real moments from your calls, podcasts and posts, waiting for a slot."},

  {k:"scheduled",t:"Scheduled",h:"In Buffer with photo and first comment (from week 3)."},
  {k:"live",t:"Live",h:"Posted. Numbers logged at 24 and 72 hours."}
];
const GATES=[["buyer","Buyer: would a founder with an open AE seat read to the end?"],["voice","Voice: built from your own sentences"],["ai","Natural: sounds like you talking"],["hook","Hook: one paragraph, 3 sentences, present tense, a number"],["facts","Facts: nothing invented, anything unsure is in [brackets]"]];
const STAGES=["Trial: you edit and post","We schedule, you review","We post, you skim","12 posts a week","X"];

const $=id=>document.getElementById(id);

const fmt=d=>{const m=String(d||"").match(/^\d{4}-(\d\d)-(\d\d)$/);return m?MON[+m[1]-1]+" "+(+m[2]):""};
const br=s=>esc(s).replace(/\[([^\]]*)\]/g,"<mark>[$1]</mark>");

const docUrl=p=>"https://docs.google.com/document/d/"+p.docId+"/edit";
const gs=p=>GATES.map(([k])=>((p.gates||{})[k]||"pending"));
function hooks(s){return String(s||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{let t=l.replace(/^\d+[.)]\s*/,"");const pick=/^\(pick\)\s*/i.test(t);return {pick,t:t.replace(/^\(pick\)\s*/i,"")}})}
const S={tab:"production",step:null,cur:null,mode:"preview"};
const posts=D.posts,ideas=D.ideas||[];

const dates=posts.map(p=>p.date).filter(Boolean).sort();
$("range").textContent=dates.length?"Week of "+fmt(dates[0])+" to "+fmt(dates[dates.length-1]):"";
const sg=Math.min(5,Math.max(1,+D.stage||1));
$("stage").textContent=`Handover stage ${sg} of 5 · ${STAGES[sg-1]}`;

function route(){
  const [h,mode]=decodeURIComponent((location.hash||"#production").slice(1)).toLowerCase().split("/");
  S.mode=mode==="edit"?"edit":"preview";
  if(["production","copy","resources","experiments"].includes(h)){S.tab=h}
  else if(posts.some(p=>slug(p)===h)){S.tab="copy";S.cur=h}
  else S.tab="production";
  document.querySelectorAll("nav.tabs a").forEach(a=>a.classList.toggle("on",a.dataset.tab===S.tab));
  for(const t of ["production","copy","resources","experiments"])$("tab-"+t).hidden=t!==S.tab;
  if(S.tab==="copy")renderCopy();
}

function renderProduction(){
  const all=[...ideas.map(i=>({...i,stage:"idea"})),...posts.map(p=>({...p,stage:p.stage==="jay"?"ready":p.stage}))];
  const counts=Object.fromEntries(STEPS.map(s=>[s.k,all.filter(p=>(p.stage||"draft")===s.k).length]));
  if(!S.step){const f=STEPS.find(s=>s.k!=="idea"&&counts[s.k]);S.step=f?f.k:"idea"}
  const st=STEPS.find(s=>s.k===S.step);
  const list=all.filter(p=>(p.stage||"draft")===S.step);
  $("tab-production").innerHTML=`<div class="steps" role="tablist">${STEPS.map(s=>`<button class="step ${s.k===S.step?"on":""} ${counts[s.k]?"":"zero"}" data-step="${s.k}"><b>${counts[s.k]}</b><span>${esc(s.t)}</span></button>`).join("")}</div>
  <div class="hint">${esc(st?st.h:"")}</div>
  <div class="cards">${list.length?list.map(card).join(""):`<div class="empty">Nothing in ${esc(st?st.t:"this step")} right now.</div>`}</div>`;
}
function card(p){
  if(p.stage==="idea")return `<div class="card"><div class="top"><span>Idea${p.painLabel?" · "+esc(p.painLabel):""}</span></div><div class="title">${esc(p.title)}</div><div class="preview" style="-webkit-line-clamp:4">${br(p.angle||"")}</div>${p.source?`<div class="sub">${esc(p.source)}</div>`:""}</div>`;
  const g=gs(p),passed=g.filter(s=>s==="pass").length;
  return `<a class="card" href="#${slug(p)}"><div class="top"><span>${esc(p.day)}${p.date?" "+fmt(p.date):""}${p.pillar?" · "+esc(p.pillar):""}</span>${p.test?`<span class="chip exp">${esc(p.test.code)}</span>`:""}</div>
    <div class="title">${esc(p.title)}</div>
    <div class="gates">${g.map(s=>`<span class="g ${s}"></span>`).join("")}<span>${passed}/5 checks</span></div>
    <div class="preview">${esc(p.draft)}</div>${p.needs?`<div class="needs">Needs from you: ${esc(p.needs)}</div>`:""}</a>`;
}

  <article class="paper">

    ${S.mode==="edit"?`<div class="postdoc"><iframe src="${esc(docUrl(p))}" title="${esc(p.title)} in Google Docs" allow="clipboard-read; clipboard-write"></iframe></div>

    <section class="field"><div class="label">Hook options</div>
      <ol class="hooks">${hooks(p.hooks).map((h,i)=>`<li class="hook ${h.pick?"pick":""}"><span class="n">${i+1}</span><p>${br(h.t)}</p>${h.pick?`<span class="pickchip">Our pick · it opens the post</span>`:""}</li>`).join("")}</ol></section>
    <section class="field"><div class="label">The post, as it shows on LinkedIn</div>
      <div class="li"><div class="li-head"><span class="av">JJ</span><div><b>Jay Johnston</b><div class="sub">Elite Tech Sales · Austin</div></div></div>
        <div class="li-text">${br(p.draft)}</div>
        <div class="photo"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg><div><div class="label">Photo idea</div><div>${esc(p.photo||"One from your folder.")}</div></div></div>
        ${p.photoFolder?`<div class="photo-drop"><div class="row"><span>Have a better one? Drop it in this post's folder.</span><a class="btn small" href="https://drive.google.com/drive/folders/${esc(p.photoFolder)}" target="_blank" rel="noopener">Add a photo</a></div><iframe src="https://drive.google.com/embeddedfolderview?id=${esc(p.photoFolder)}#grid" title="Photos for this post" loading="lazy"></iframe></div>`:""}</div>
    </section>
    <section class="field" style="margin-bottom:0"><div class="label">First comment</div>
      <div class="cm"><span class="av sm">JJ</span><div class="bubble"><b>Jay Johnston</b>${p.firstComment?br(p.firstComment):`<span class="none">No first comment on this one.</span>`}</div></div>
    </section>`}
  </article>
  <aside class="rail">
    ${p.needs?`<section class="box needbox"><h3>Needs from you</h3><p>${esc(p.needs)}</p></section>`:""}
    <section class="box"><h3>Why this post</h3>
      ${item("The pain",String(w.pain||"").replace(/^"|"$/g,""),"pain")}
      ${item(/^"/.test(String(w.pain||""))?"The belief we break":"Why this slot",w.belief)}

      ${w.source||w.quote?`<div class="item"><div class="label">Built from</div><p>${esc(w.source||"")}</p>${w.quote?`<p class="quote">"${esc(w.quote)}"</p>`:""}</div>`:""}

function renderResources(){
  const R=D.resources||{};const link=(t,d,u,cta)=>`<section class="box"><h3>${esc(t)}</h3><p>${esc(d)}</p>${u?`<a class="btn ghost small" style="justify-self:start" href="${esc(u)}" target="_blank" rel="noopener">${esc(cta||"Open")}</a>`:`<span class="wait">Waiting on the link from you</span>`}</section>`;
  $("tab-resources").innerHTML=`<div class="res">
    ${link("Empty seat calculator","Goes in the first comment of the cost posts.",R.calculator)}
    ${link("7-step hiring guide","Goes in the first comment of the interview posts. No email required.",R.guide)}
    ${link("Book a call","Your calendar link, for the flex and social proof posts.",R.calendar)}
    ${link("Photo library","Your Google Photos folder, so every post gets a real photo.",R.photos,"Open the folder")}
    ${link("Buffer","Where posts get scheduled from week 3.",R.buffer)}
  </div>
  ${R.folder?`<div class="box" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h3>Shared folder</h3><p class="sub" style="margin:4px 0 0">Drop anything useful here: guides, decks, screenshots, client wins, photos.</p></div><a class="btn small" href="https://drive.google.com/drive/folders/${esc(R.folder)}" target="_blank" rel="noopener">Upload files</a></div></div>
  <div class="folder"><iframe src="https://drive.google.com/embeddedfolderview?id=${esc(R.folder)}#list" title="Shared resources folder" loading="lazy"></iframe></div>`:""}`;
}
function renderExps(){
  const ex=D.experiments||[];
  const live=posts.filter(p=>p.stage==="live");
  const sum=f=>live.reduce((a,p)=>a+(+p[f]||0),0);
  const ed=posts.filter(p=>p.edits!=null&&p.edits!=="");
  $("tab-experiments").innerHTML=`<div class="score">
    <div><b>${sum("leads")}<span style="font-size:13px"> / 5</span></b><span>leads this week</span></div>
    <div><b>${ed.length?(ed.reduce((a,p)=>a+(+p.edits||0),0)/ed.length).toFixed(1):"–"}</b><span>your edits per post</span></div>
    <div><b>${sum("founderComments")}</b><span>founder comments</span></div></div>`+
  (ex.length?ex.map(e=>{const names=(e.posts||[]).map(id=>{const p=posts.find(x=>x.id===id);return p?`${p.day}${p.date?" "+fmt(p.date):""} (${p.title})`:""}).filter(Boolean).join(", ");
    return `<div class="exp-card"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(e.code)} · ${esc(e.title)}</h3><span class="state">${esc(e.decision||"running")}</span></div>
    <dl class="kv"><dt>Hypothesis</dt><dd>${esc(e.hypothesis)}</dd><dt>Testing</dt><dd>${esc(e.variable)}</dd><dt>Posts</dt><dd>${esc(names)}</dd><dt>Metric</dt><dd>${esc(e.metric)}</dd><dt>Result</dt><dd>${esc(e.result||"After the posts have 72 hours of numbers.")}</dd></dl></div>`}).join(""):`<div class="empty">No experiments this week yet.</div>`);
}

async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(_){return false}}}
document.addEventListener("click",async e=>{
  const st=e.target.closest("[data-step]");if(st){S.step=st.dataset.step;renderProduction();return}
  const b=e.target.closest("[data-copy]");if(!b)return;
  const p=posts.find(x=>slug(x)===S.cur);if(!p)return;
  const t=b.dataset.copy==="link"?location.origin+location.pathname+"#"+slug(p):p.draft;
  if(await copyText(t)){const o=b.textContent;b.textContent="Copied";b.classList.add("done");setTimeout(()=>{b.textContent=o;b.classList.remove("done")},1500)}
});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
renderProduction();renderExps();renderResources();route();
</script>
</body>
